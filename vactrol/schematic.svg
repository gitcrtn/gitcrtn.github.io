<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 525 500" class="sch" role="img" aria-labelledby="sch-title">
  <title id="sch-title">Vactrol Synth V2.0 回路図（描き直し）</title>

  <!-- ===== clock oscillator (74C14) ===== -->
  <g class="w">
    <path d="M40 90 H65"/>
    <path d="M113 90 H170"/>
    <path d="M140 90 V45 H110"/>
    <path d="M70 45 H40 V128"/>
    <path d="M40 136 V150"/>
    <path d="M65 72 L105 90 L65 108 Z"/>
    <path d="M70 45 l4 -7 l6 14 l6 -14 l6 14 l6 -14 l6 14 l6 -7"/>
    <path d="M74 58 L104 32"/>
    <path d="M28 128 H52 M28 136 H52"/>
    <path d="M30 150 H50 M34 155 H46 M38 160 H42"/>
  </g>
  <circle class="w" cx="109" cy="90" r="4"/>
  <path class="w thin" d="M73 95 h10 v-10 h5 M77 95 v-10 h10"/>
  <path class="head" d="M104 32 l-8 1 l5 5 z"/>
  <circle class="dot" cx="40" cy="90" r="3"/><circle class="dot" cx="140" cy="90" r="3"/>
  <text class="lbl" x="90" y="24" text-anchor="middle">CLOCK <tspan class="val">1MΩ</tspan></text>
  <text class="val" x="85" y="124" text-anchor="middle">74C14</text>
  <text class="val" x="58" y="137">0.1µF</text>

  <!-- ===== 4040 + DIVIDER ===== -->
  <rect class="w" x="170" y="65" width="110" height="80" rx="3"/>
  <text class="part" x="225" y="102" text-anchor="middle">4040</text>
  <text class="pin" x="176" y="94">CLK</text>
  <g class="pin" text-anchor="middle">
    <text x="190" y="139">1/2</text><text x="215" y="139">1/4</text><text x="240" y="139">1/8</text><text x="265" y="139">1/16</text>
  </g>
  <g class="w">
    <path d="M190 145 V168 M190 192 V210 M190 192 L201 171"/>
    <path d="M215 145 V168 M215 192 V210 M215 192 L226 171"/>
    <path d="M240 145 V168 M240 192 V210 M240 192 L251 171"/>
    <path d="M265 145 V168 M265 192 V210 M265 192 L276 171"/>
    <path d="M190 210 H300"/>
  </g>
  <g class="dot">
    <circle cx="190" cy="168" r="2.5"/><circle cx="215" cy="168" r="2.5"/><circle cx="240" cy="168" r="2.5"/><circle cx="265" cy="168" r="2.5"/>
    <circle cx="215" cy="210" r="3"/><circle cx="240" cy="210" r="3"/><circle cx="265" cy="210" r="3"/>
  </g>
  <text class="lbl" x="227" y="232" text-anchor="middle">DIVIDER</text>

  <!-- ===== LED trimmer -> vactrol ===== -->
  <g class="w">
    <path d="M300 210 l4 -7 l6 14 l6 -14 l6 14 l6 -14 l6 14 l6 -7"/>
    <path d="M304 223 L334 197"/>
    <path d="M340 210 H370 V248"/>
    <path d="M359 248 H381 L370 266 Z M359 266 H381"/>
    <path d="M370 266 V318"/>
    <path d="M360 318 H380 M364 323 H376 M368 328 H372"/>
  </g>
  <path class="head" d="M334 197 l-8 1 l5 5 z"/>
  <text class="lbl" x="320" y="190" text-anchor="middle">LED <tspan class="val">1MΩ</tspan></text>
  <rect class="box" x="346" y="230" width="108" height="76" rx="10"/>
  <path class="w thin" d="M384 252 L400 244 M384 262 L400 254"/>
  <path class="head" d="M400 244 l-7 0 l3 5 z M400 254 l-7 0 l3 5 z"/>
  <text class="lbl" x="340" y="262" text-anchor="end">LED</text>
  <path class="w" d="M420 244 l-7 3 l14 5 l-14 5 l14 5 l-14 5 l14 5 l-14 5 l7 3 V284"/>
  <text class="lbl" x="431" y="270">CdS</text>
  <text class="val tiny" x="395" y="241" text-anchor="middle">VACTROL</text>

  <!-- CdS: top end to the 4093 output, bottom end to input B -->
  <g class="w">
    <path d="M420 244 V222 H478 V407"/>
    <path d="M420 284 V350 H260 V362 M260 370 V384"/>
    <path d="M248 362 H272 M248 370 H272"/>
    <path d="M250 384 H270 M254 389 H266 M258 394 H262"/>
    <path d="M300 350 V394 H330"/>
  </g>
  <circle class="dot" cx="300" cy="350" r="3"/>
  <text class="val" x="243" y="371" text-anchor="end">0.01µF</text>

  <!-- ===== gate oscillator (74C14) ===== -->
  <g class="w">
    <path d="M40 420 H65"/>
    <path d="M113 420 H330"/>
    <path d="M140 420 V375 H110"/>
    <path d="M70 375 H40 V458"/>
    <path d="M40 466 V480"/>
    <path d="M65 402 L105 420 L65 438 Z"/>
    <path d="M70 375 l4 -7 l6 14 l6 -14 l6 14 l6 -14 l6 14 l6 -7"/>
    <path d="M74 388 L104 362"/>
    <path d="M28 458 H52 M28 466 H52"/>
    <path d="M30 480 H50 M34 485 H46 M38 490 H42"/>
  </g>
  <circle class="w" cx="109" cy="420" r="4"/>
  <path class="w thin" d="M73 425 h10 v-10 h5 M77 425 v-10 h10"/>
  <path class="head" d="M104 362 l-8 1 l5 5 z"/>
  <circle class="dot" cx="40" cy="420" r="3"/><circle class="dot" cx="140" cy="420" r="3"/>
  <text class="lbl" x="90" y="354" text-anchor="middle">GATE <tspan class="val">1MΩ</tspan></text>
  <text class="val" x="85" y="454" text-anchor="middle">74C14</text>
  <text class="val" x="58" y="467">0.1µF</text>

  <!-- ===== 4093 tone oscillator -> output ===== -->
  <path class="w" d="M330 382 H355 A25 25 0 0 1 355 432 H330 Z"/>
  <circle class="w" cx="384" cy="407" r="4"/>
  <path class="w thin" d="M341 412 h10 v-10 h5 M345 412 v-10 h10"/>
  <text class="val" x="355" y="452" text-anchor="middle">4093</text>
  <g class="w">
    <path d="M388 407 H490 M498 407 H508"/>
    <path d="M490 395 V419 M498 395 V419"/>
  </g>
  <circle class="dot" cx="478" cy="407" r="3"/>
  <circle class="w" cx="513" cy="407" r="5"/>
  <text class="val" x="513" y="391" text-anchor="middle">OUT</text>
</svg>
